server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 1. Auth service (без JWT - публичные эндпоинты)
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**, /swagger-ui/**, /v3/api-docs/**, /actuator/health

            # 2. User service
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
              filters:
                - JwtAuthentication

            # 3. Ticket service
            - id: ticket-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/tickets/**
              filters:
                - JwtAuthentication

            # 4. Workflow service (НОВЫЙ)
            - id: workflow-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/workflow/**
              filters:
                - JwtAuthentication

# JWT ключи
jwt:
  public-key-path: classpath:keys/public.pem

# Логирование
logging:
  level:
    com.example.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG