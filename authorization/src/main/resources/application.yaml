server:
  port: 8081

spring:
  application:
    name: authorization

  datasource:
    url: jdbc:postgresql://80.93.62.239:5432/prism
#    url: jdbc:postgresql://127.0.0.1:5432/prism
    username: postgres
    password: 12Hiro0016

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  access-token-expiration: 900000   # 15 минут (в миллисекундах)
  refresh-token-expiration: 2592000000  # 30 дней

blacklist:
  enabled: true                         # включаем blacklist
  cache-ttl: 900000                     # TTL для черного списка (15 минут)

logging:
  level:
    com.example.authorization: DEBUG


# authorization/src/main/resources/application.yml
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

info:
  title: Auth Service API
  description: |
    ## Сервис аутентификации и авторизации
    
    ### Основные возможности:
    - Регистрация пользователей
    - Логин (JWT токены)
    - Refresh токены
    - Logout (Blacklist)
    - Управление пользователями (ADMIN)
    
    ### Безопасность:
    - RS256 асимметричное шифрование
    - Refresh token rotation
    - Blacklist через Redis
  version: 1.0.0
  contact:
    name: Support Team
    email: support@example.com

